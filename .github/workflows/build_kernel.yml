name: Build Kernel
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Select Project'
        required: true
        type: choice
        options:
          - mi17_sm8850
          - uws6152_ums312
          - uws6152_cd12m
        default: 'mi17_sm8850'
      build_flavor:
        description: 'Build Flavor (for mi17: both, standard, or stock_stealth)'
        required: true
        type: choice
        options:
          - both
          - standard
          - stock_stealth
        default: 'both'
      force_build:
        description: 'Force build even if no upstream changes'
        type: boolean
        default: true
      branch:
        description: 'Git Branch/Tag'
        required: true
        default: 'resukisu'
      ksu_variant:
        description: 'Build Mode Override'
        type: choice
        options:
          - default
          - resukisu
          - lkm
        default: 'default'
      do_release:
        description: 'Create Release'
        type: boolean
        default: true
      custom_localversion:
        description: 'Custom Localversion Override (leave empty for auto/default)'
        type: string
        required: false
        default: ''
      resukisu_setup_arg:
        description: 'ReSukiSU setup.sh argument override'
        type: string
        required: false
        default: ''
      apply_susfs:
        description: 'Apply SuSFS dynamically during build'
        type: boolean
        default: true
      apply_bbg:
        description: 'Apply Baseband Guard dynamically during build'
        type: boolean
        default: false
  repository_dispatch:
    types: [build-kernel]

jobs:
  check-and-matrix:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}
      do_release: ${{ steps.resolve.outputs.do_release }}
      project: ${{ steps.resolve.outputs.project }}
      branch: ${{ steps.resolve.outputs.branch }}
      release_date: ${{ steps.resolve.outputs.release_date }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Inputs & Check Upstream
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"

          if [ "$event" = "schedule" ]; then
            project="mi17_sm8850"
            branch="resukisu"
            flavor="both"
            force="false"
            release="true"
            variant="default"
            custom_localversion=""
            resukisu_setup_arg=""
            apply_susfs="true"
            apply_bbg="false"
          elif [ "$event" = "repository_dispatch" ]; then
            project="${{ github.event.client_payload.project || 'mi17_sm8850' }}"
            branch="${{ github.event.client_payload.branch || 'resukisu' }}"
            flavor="${{ github.event.client_payload.build_flavor || 'both' }}"
            force="true"
            release="${{ github.event.client_payload.do_release || 'true' }}"
            variant="${{ github.event.client_payload.ksu_variant || 'default' }}"
            custom_localversion="${{ github.event.client_payload.custom_localversion || '' }}"
            resukisu_setup_arg="${{ github.event.client_payload.resukisu_setup_arg || '' }}"
            apply_susfs="${{ github.event.client_payload.apply_susfs || 'true' }}"
            apply_bbg="${{ github.event.client_payload.apply_bbg || 'false' }}"
          else
            project="${{ inputs.project }}"
            branch="${{ inputs.branch }}"
            flavor="${{ inputs.build_flavor }}"
            force="${{ inputs.force_build }}"
            release="${{ inputs.do_release }}"
            variant="${{ inputs.ksu_variant }}"
            custom_localversion="${{ inputs.custom_localversion }}"
            resukisu_setup_arg="${{ inputs.resukisu_setup_arg }}"
            apply_susfs="${{ inputs.apply_susfs }}"
            apply_bbg="${{ inputs.apply_bbg }}"
          fi

          if [ "$variant" = "default" ] || [ -z "$variant" ]; then
            resolved_variant="$branch"
          else
            resolved_variant="$variant"
          fi

          should_build="true"

          if [ "$event" = "schedule" ]; then
            upstream_hash=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | head -n1 | awk '{print substr($1, 1, 7)}')
            current_tracked=$(jq -r '.resukisu // ""' configs/upstream_commits.json 2>/dev/null || echo "")
            if [ -n "$upstream_hash" ] && [ "$upstream_hash" != "$current_tracked" ]; then
              echo "Upstream ReSukiSU updated: $current_tracked -> $upstream_hash"
              gh release download ci-core-latest -p "kokuban_ci_core" --clobber
              chmod +x kokuban_ci_core
              ./kokuban_ci_core update --token "$GH_TOKEN" --project "$project" --variant "resukisu" --commit-id "$upstream_hash"
              
              git config --global user.name "Kokuban-Watcher"
              git config --global user.email "watcher@kokuban.dev"
              jq --arg h "$upstream_hash" '.resukisu = $h' configs/upstream_commits.json > configs/upstream_commits.tmp && mv configs/upstream_commits.tmp configs/upstream_commits.json
              git add configs/upstream_commits.json
              git commit -m "ci: update upstream records to $upstream_hash [skip ci]" || true
              git push || true
              should_build="true"
            else
              echo "No upstream changes found."
              if [ "$force" != "true" ]; then
                should_build="false"
              fi
            fi
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "do_release=$release" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          release_date=$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"

          if [ "$should_build" = "true" ]; then
            if [ "$project" = "mi17_sm8850" ]; then
              if [ "$flavor" = "both" ]; then
                matrix=$(jq -c -n \
                  --arg br "$branch" \
                  --arg var "$resolved_variant" \
                  --arg clv "$custom_localversion" \
                  --arg rsa "$resukisu_setup_arg" \
                  --arg susfs "$apply_susfs" \
                  --arg bbg "$apply_bbg" \
                  '[
                    {
                      project: "mi17_sm8850",
                      flavor: "standard",
                      branch: $br,
                      variant: $var,
                      custom_localversion: $clv,
                      resukisu_setup_arg: $rsa,
                      stealth: false,
                      apply_susfs: $susfs,
                      apply_bbg: $bbg
                    },
                    {
                      project: "mi17_sm8850_stealth",
                      flavor: "stock_stealth",
                      branch: $br,
                      variant: $var,
                      custom_localversion: "-android16-6-gb1493ec68d4a-abogki514973465-4k",
                      resukisu_setup_arg: $rsa,
                      stealth: true,
                      apply_susfs: $susfs,
                      apply_bbg: $bbg
                    }
                  ]')
              elif [ "$flavor" = "stock_stealth" ]; then
                matrix=$(jq -c -n \
                  --arg br "$branch" \
                  --arg var "$resolved_variant" \
                  --arg rsa "$resukisu_setup_arg" \
                  --arg susfs "$apply_susfs" \
                  --arg bbg "$apply_bbg" \
                  '[
                    {
                      project: "mi17_sm8850_stealth",
                      flavor: "stock_stealth",
                      branch: $br,
                      variant: $var,
                      custom_localversion: "-android16-6-gb1493ec68d4a-abogki514973465-4k",
                      resukisu_setup_arg: $rsa,
                      stealth: true,
                      apply_susfs: $susfs,
                      apply_bbg: $bbg
                    }
                  ]')
              else
                matrix=$(jq -c -n \
                  --arg br "$branch" \
                  --arg var "$resolved_variant" \
                  --arg clv "$custom_localversion" \
                  --arg rsa "$resukisu_setup_arg" \
                  --arg susfs "$apply_susfs" \
                  --arg bbg "$apply_bbg" \
                  '[
                    {
                      project: "mi17_sm8850",
                      flavor: "standard",
                      branch: $br,
                      variant: $var,
                      custom_localversion: $clv,
                      resukisu_setup_arg: $rsa,
                      stealth: false,
                      apply_susfs: $susfs,
                      apply_bbg: $bbg
                    }
                  ]')
              fi
            else
              matrix=$(jq -c -n \
                --arg proj "$project" \
                --arg br "$branch" \
                --arg var "$resolved_variant" \
                --arg clv "$custom_localversion" \
                --arg rsa "$resukisu_setup_arg" \
                --arg susfs "$apply_susfs" \
                --arg bbg "$apply_bbg" \
                '[
                  {
                    project: $proj,
                    flavor: "standard",
                    branch: $br,
                    variant: $var,
                    custom_localversion: $clv,
                    resukisu_setup_arg: $rsa,
                    stealth: false,
                    apply_susfs: $susfs,
                    apply_bbg: $bbg
                  }
                ]')
            fi
            echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"
          else
            echo "build_matrix=[]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-and-matrix
    if: needs.check-and-matrix.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check-and-matrix.outputs.build_matrix) }}
    env:
      ARTIFACT_DIR: build_artifacts
      PROJECT: ${{ matrix.project }}
      BRANCH_TARGET: ${{ matrix.branch }}
      VARIANT: ${{ matrix.variant }}
      CUSTOM_LOCALVERSION: ${{ matrix.custom_localversion }}
      RESUKISU_SETUP_ARG: ${{ matrix.resukisu_setup_arg }}
      APPLY_SUSFS: ${{ matrix.apply_susfs }}
      APPLY_BBG: ${{ matrix.apply_bbg }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Artifact Name
        run: |
          echo "ARTIFACT_NAME=${{ matrix.project }}-${{ matrix.flavor }}-zip" >> "$GITHUB_ENV"

      - name: Configure Stealth Metadata
        if: matrix.stealth == true
        run: |
          echo "SOURCE_DATE_EPOCH=1779287194" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Wed May 20 14:26:34 UTC 2026" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=kleaf" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=build-host" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

      - name: Prepare Host Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libyaml-dev pkg-config bison flex bc libssl-dev libelf-dev
        continue-on-error: true

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          gh release download ci-core-latest --repo MoeclubM/Kernel_CI_Center -p "kokuban_ci_core"
          chmod +x kokuban_ci_core

      - name: Parse Configuration
        run: ./kokuban_ci_core parse --project ${{ env.PROJECT }}

      - name: Checkout Kernel Source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PROJECT_REPO }}
          ref: ${{ env.BRANCH_TARGET }}
          path: kernel_source
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          key: kernel-build-shared-${{ env.PROJECT }}-v4
          max-size: 5G

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses5-dev bc bison flex libssl-dev p7zip-full pigz lz4 cpio curl libelf-dev dwarves jq lld pahole libdw-dev
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Ensure compat cross-linker
        run: |
          mkdir -p "$HOME/.local/bin"
          for name in arm-linux-gnueabi-ld arm-linux-gnueabi-ld.bfd; do
            if ! command -v "$name" &>/dev/null; then
              ln -sf "$(command -v ld.lld)" "$HOME/.local/bin/$name"
              echo "Created $HOME/.local/bin/$name -> $(command -v ld.lld)"
            fi
          done

      - name: Build Kernel Package (do-release false)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ARGS=(--project ${{ env.PROJECT }} --branch ${{ env.VARIANT }} --do-release false)
          if [ -n "${{ env.CUSTOM_LOCALVERSION }}" ]; then
            ARGS+=("--custom-localversion=${{ env.CUSTOM_LOCALVERSION }}")
          fi
          if [ -n "${{ env.RESUKISU_SETUP_ARG }}" ]; then
            ARGS+=("--resukisu-setup-arg=${{ env.RESUKISU_SETUP_ARG }}")
          fi
          ARGS+=("--apply-susfs" "${{ env.APPLY_SUSFS }}")
          ARGS+=("--apply-bbg" "${{ env.APPLY_BBG }}")
          ./kokuban_ci_core build "${ARGS[@]}"

      - name: Collect Build Artifacts
        if: always()
        id: collect-artifacts
        run: |
          mkdir -p "$ARTIFACT_DIR"
          shopt -s nullglob
          copied=0
          for zipball in *.zip; do
            cp "$zipball" "$ARTIFACT_DIR/"
            copied=1
          done
          if [ "$copied" -eq 1 ]; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "No zip artifacts found!"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.collect-artifacts.outputs.has_artifacts == 'true'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
          include-hidden-files: false

  unified-release:
    needs: [check-and-matrix, build]
    if: needs.check-and-matrix.outputs.do_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded_artifacts

      - name: Create Unified Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          mkdir -p release_pkgs
          find downloaded_artifacts -type f -name "*.zip" -exec cp -v {} release_pkgs/ \;
          ls -lh release_pkgs/

          pkg_count=$(ls -1 release_pkgs/*.zip 2>/dev/null | wc -l)
          if [ "$pkg_count" -eq 0 ]; then
            echo "No zip packages found to release."
            exit 1
          fi

          DATE_TAG="${{ needs.check-and-matrix.outputs.release_date }}"
          TAG="Mi17_Kernel-ReSuki-susfs-${DATE_TAG}"
          TITLE="Mi17 Kernel ReSuki-susfs Dual Build (${DATE_TAG})"
          cat << 'EOF' > release_notes.md
          ### 📱 小米 17 系列内核双版本发布 (Dual Build)

          * **发布时间**：${DATE_TAG}
          * **集成特性**：ReSukiSU + SuSFS + Re-Kernel + TCP Brutal + ADIOS

          ---

          #### 📦 本次发布包含的刷机包文件（请二选一刷入）：
          1. **标准版 (Standard)**
             - 文件匹配：`Mi17_Kernel-*.zip`
             - 说明：常规自定义内核标志与版本号。

          2. **原厂伪装版 (StockStealth)**
             - 文件匹配：`Mi17_Kernel_StockStealth-*.zip`
             - 说明：官方原厂元数据模拟（构建时间 `Wed May 20 14:26:34 UTC 2026`、主机签名 `kleaf@build-host`、版本号 `-android16-6-gb1493ec68d4a-abogki514973465-4k`）。
          EOF

          gh release create "$TAG" release_pkgs/*.zip \
            --repo MoeclubM/android_kernel_xiaomi_sm8850 \
            --title "$TITLE" \
            --notes-file release_notes.md
