name: Release All Branches
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Select Project'
        required: true
        type: choice
        options: [mi17_sm8850, uws6152_ums312, uws6152_cd12m]

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ./scripts/fetch-ci-core.sh

      - name: Generate Matrix
        id: set-matrix
        run: ./kokuban_ci_core matrix --project ${{ inputs.project }}

  build:
    needs: matrix
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
      fail-fast: false
      # One kernel build at a time: a mass release must not fan out to N runners at once.
      max-parallel: 1
    uses: ./.github/workflows/build_kernel.yml
    with:
      project: ${{ inputs.project }}
      branch: ${{ matrix.branch }}
      ksu_variant: ${{ matrix.ksu_variant }}
      do_release: true
    secrets: inherit
