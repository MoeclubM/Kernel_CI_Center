name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Select Project'
        required: true
        type: choice
        options:
          - mi17_sm8850
          - uws6152_ums312
          - uws6152_cd12m
      build_flavor:
        description: 'Build Flavor (for mi17: both, standard, or stock_stealth)'
        required: true
        type: choice
        options:
          - both
          - standard
          - stock_stealth
        default: 'both'
      branch:
        description: 'Git Branch/Tag'
        required: true
        default: 'main'
      ksu_variant:
        description: 'Build Mode Override'
        type: choice
        options:
          - default
          - resukisu
          - lkm
        default: 'default'
      do_release:
        description: 'Create Release'
        type: boolean
        default: true
      custom_localversion:
        description: 'Custom Localversion Override (leave empty for auto/default)'
        type: string
        required: false
        default: ''
      resukisu_setup_arg:
        description: 'ReSukiSU setup.sh argument override'
        type: string
        required: false
        default: ''
      apply_susfs:
        description: 'Apply SuSFS dynamically during build'
        type: boolean
        default: true
      apply_bbg:
        description: 'Apply Baseband Guard dynamically during build'
        type: boolean
        default: false
  repository_dispatch:
    types: [build-kernel]
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      build_flavor:
        type: string
        default: 'both'
      branch:
        required: true
        type: string
      ksu_variant:
        type: string
        default: 'default'
      do_release:
        type: boolean
        default: true
      custom_localversion:
        type: string
        default: ''
      resukisu_setup_arg:
        type: string
        default: ''
      apply_susfs:
        type: boolean
        default: true
      apply_bbg:
        type: boolean
        default: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.resolve.outputs.build_matrix }}
    steps:
      - name: Resolve Build Matrix
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            project="${{ github.event.client_payload.project }}"
            branch="${{ github.event.client_payload.branch }}"
            variant="${{ github.event.client_payload.ksu_variant }}"
            [ -z "$variant" ] && variant="default"
            release="${{ github.event.client_payload.do_release }}"
            [ -z "$release" ] && release="true"
            flavor="${{ github.event.client_payload.build_flavor }}"
            [ -z "$flavor" ] && flavor="both"
            custom_localversion="${{ github.event.client_payload.custom_localversion }}"
            resukisu_setup_arg="${{ github.event.client_payload.resukisu_setup_arg }}"
            apply_susfs="${{ github.event.client_payload.apply_susfs }}"
            [ -z "$apply_susfs" ] && apply_susfs="true"
            apply_bbg="${{ github.event.client_payload.apply_bbg }}"
            [ -z "$apply_bbg" ] && apply_bbg="false"
          else
            project="${{ inputs.project }}"
            branch="${{ inputs.branch }}"
            variant="${{ inputs.ksu_variant }}"
            release="${{ inputs.do_release }}"
            flavor="${{ inputs.build_flavor }}"
            custom_localversion="${{ inputs.custom_localversion }}"
            resukisu_setup_arg="${{ inputs.resukisu_setup_arg }}"
            apply_susfs="${{ inputs.apply_susfs }}"
            apply_bbg="${{ inputs.apply_bbg }}"
          fi

          if [ "$variant" = "default" ] || [ -z "$variant" ]; then
            resolved_variant="$branch"
          else
            resolved_variant="$variant"
          fi

          if [ "$project" = "mi17_sm8850" ]; then
            if [ "$flavor" = "both" ]; then
              matrix=$(jq -c -n \
                --arg br "$branch" \
                --arg var "$resolved_variant" \
                --arg rel "$release" \
                --arg clv "$custom_localversion" \
                --arg rsa "$resukisu_setup_arg" \
                --arg susfs "$apply_susfs" \
                --arg bbg "$apply_bbg" \
                '[
                  {
                    project: "mi17_sm8850",
                    flavor: "standard",
                    branch: $br,
                    variant: $var,
                    do_release: $rel,
                    custom_localversion: $clv,
                    resukisu_setup_arg: $rsa,
                    stealth: false,
                    apply_susfs: $susfs,
                    apply_bbg: $bbg
                  },
                  {
                    project: "mi17_sm8850_stealth",
                    flavor: "stock_stealth",
                    branch: $br,
                    variant: $var,
                    do_release: $rel,
                    custom_localversion: "-android16-6-gb1493ec68d4a-abogki514973465-4k",
                    resukisu_setup_arg: $rsa,
                    stealth: true,
                    apply_susfs: $susfs,
                    apply_bbg: $bbg
                  }
                ]')
            elif [ "$flavor" = "stock_stealth" ]; then
              matrix=$(jq -c -n \
                --arg br "$branch" \
                --arg var "$resolved_variant" \
                --arg rel "$release" \
                --arg rsa "$resukisu_setup_arg" \
                --arg susfs "$apply_susfs" \
                --arg bbg "$apply_bbg" \
                '[
                  {
                    project: "mi17_sm8850_stealth",
                    flavor: "stock_stealth",
                    branch: $br,
                    variant: $var,
                    do_release: $rel,
                    custom_localversion: "-android16-6-gb1493ec68d4a-abogki514973465-4k",
                    resukisu_setup_arg: $rsa,
                    stealth: true,
                    apply_susfs: $susfs,
                    apply_bbg: $bbg
                  }
                ]')
            else
              matrix=$(jq -c -n \
                --arg br "$branch" \
                --arg var "$resolved_variant" \
                --arg rel "$release" \
                --arg clv "$custom_localversion" \
                --arg rsa "$resukisu_setup_arg" \
                --arg susfs "$apply_susfs" \
                --arg bbg "$apply_bbg" \
                '[
                  {
                    project: "mi17_sm8850",
                    flavor: "standard",
                    branch: $br,
                    variant: $var,
                    do_release: $rel,
                    custom_localversion: $clv,
                    resukisu_setup_arg: $rsa,
                    stealth: false,
                    apply_susfs: $susfs,
                    apply_bbg: $bbg
                  }
                ]')
            fi
          else
            matrix=$(jq -c -n \
              --arg proj "$project" \
              --arg br "$branch" \
              --arg var "$resolved_variant" \
              --arg rel "$release" \
              --arg clv "$custom_localversion" \
              --arg rsa "$resukisu_setup_arg" \
              --arg susfs "$apply_susfs" \
              --arg bbg "$apply_bbg" \
              '[
                {
                  project: $proj,
                  flavor: "standard",
                  branch: $br,
                  variant: $var,
                  do_release: $rel,
                  custom_localversion: $clv,
                  resukisu_setup_arg: $rsa,
                  stealth: false,
                  apply_susfs: $susfs,
                  apply_bbg: $bbg
                }
              ]')
          fi

          echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: setup-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup-matrix.outputs.build_matrix) }}
    env:
      ARTIFACT_DIR: build_artifacts
      PROJECT: ${{ matrix.project }}
      BRANCH_TARGET: ${{ matrix.branch }}
      VARIANT: ${{ matrix.variant }}
      DO_RELEASE: ${{ matrix.do_release }}
      CUSTOM_LOCALVERSION: ${{ matrix.custom_localversion }}
      RESUKISU_SETUP_ARG: ${{ matrix.resukisu_setup_arg }}
      APPLY_SUSFS: ${{ matrix.apply_susfs }}
      APPLY_BBG: ${{ matrix.apply_bbg }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Artifact Name
        run: |
          safe_branch=$(printf '%s' "${{ matrix.branch }}" | sed 's#[^A-Za-z0-9._-]#-#g')
          echo "ARTIFACT_NAME=${{ matrix.project }}-${{ matrix.flavor }}-${safe_branch}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Configure Stealth Metadata
        if: matrix.stealth == true
        run: |
          echo "SOURCE_DATE_EPOCH=1779287194" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Wed May 20 14:26:34 UTC 2026" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=kleaf" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=build-host" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

      - name: Prepare Host Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libyaml-dev pkg-config bison flex bc libssl-dev libelf-dev
        continue-on-error: true

      - name: Download CI Core
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          gh release download ci-core-latest --repo MoeclubM/Kernel_CI_Center -p "kokuban_ci_core"
          chmod +x kokuban_ci_core

      - name: Parse Configuration
        run: ./kokuban_ci_core parse --project ${{ env.PROJECT }}

      - name: Checkout Kernel Source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PROJECT_REPO }}
          ref: ${{ env.BRANCH_TARGET }}
          path: kernel_source
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          key: kernel-build-shared-${{ env.PROJECT }}-v4
          max-size: 5G

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses5-dev bc bison flex libssl-dev p7zip-full pigz lz4 cpio curl libelf-dev dwarves jq lld pahole libdw-dev
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Ensure compat cross-linker
        run: |
          mkdir -p "$HOME/.local/bin"
          for name in arm-linux-gnueabi-ld arm-linux-gnueabi-ld.bfd; do
            if ! command -v "$name" &>/dev/null; then
              ln -sf "$(command -v ld.lld)" "$HOME/.local/bin/$name"
              echo "Created $HOME/.local/bin/$name -> $(command -v ld.lld)"
            fi
          done

      - name: Build and Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ARGS=(--project ${{ env.PROJECT }} --branch ${{ env.VARIANT }} --do-release ${{ env.DO_RELEASE }})
          if [ -n "${{ env.CUSTOM_LOCALVERSION }}" ]; then
            ARGS+=("--custom-localversion=${{ env.CUSTOM_LOCALVERSION }}")
          fi
          if [ -n "${{ env.RESUKISU_SETUP_ARG }}" ]; then
            ARGS+=("--resukisu-setup-arg=${{ env.RESUKISU_SETUP_ARG }}")
          fi
          ARGS+=("--apply-susfs" "${{ env.APPLY_SUSFS }}")
          ARGS+=("--apply-bbg" "${{ env.APPLY_BBG }}")
          ./kokuban_ci_core build "${ARGS[@]}"

      - name: Collect Build Artifacts
        if: always()
        id: collect-artifacts
        run: |
          if ./kokuban_ci_core collect-artifacts --artifact-dir "$ARTIFACT_DIR"; then
            :
          else
            echo "collect-artifacts command unavailable, falling back to shell collector."
            mkdir -p "$ARTIFACT_DIR"
            shopt -s nullglob

            copied=0
            for zipball in *.zip; do
              cp "$zipball" "$ARTIFACT_DIR/"
              copied=1
            done

            for extra_file in kernel_source/out/.config kernel_source/out/vmlinux.symvers; do
              if [ -f "$extra_file" ]; then
                cp "$extra_file" "$ARTIFACT_DIR/"
                copied=1
              fi
            done

            if [ "$copied" -eq 1 ]; then
              echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
              echo "No build artifacts were produced, skipping upload."
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.collect-artifacts.outputs.has_artifacts == 'true'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
          include-hidden-files: true
